# dsh-local-hanaccount — Web access lock (v2)
- insert:
    - id: dsh-local-hanaccount
      name: dsh-local-hanaccount
      config:
        enabled: true
        # Required connection methods and WebServer route structure are detected.
        # Legacy officialBuild values remain readable metadata, not a version gate.
        canonicalOrigin: ""
        loginStylesheetUrl: ""
        outboundFetchEnabled: false
        dataDir: ""
        allow: ["127.0.0.1", "::1"]
        deny: []
        ipLimitEnabled: true
        nginxBasicAutoLogin: false
        keyAuthEnabled: true
        routePolicy:
          mode: protect-all
          excludePrefixes: []
