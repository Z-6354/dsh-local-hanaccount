# dsh-local-hanaccount — Web access lock (v2)
- insert:
    - id: dsh-local-hanaccount
      name: dsh-local-hanaccount
      config:
        enabled: true
        # Explicit audited build selection; operator attestation, not binary proof.
        officialBuild: "0a15e36e7f82b6ed45af6fa9759f29b40dcd965d"
        canonicalOrigin: ""
        loginStylesheetUrl: ""
        outboundFetchEnabled: false
        dataDir: ""
        allow: ["127.0.0.1", "::1"]
        deny: []
        ipLimitEnabled: true
        nginxBasicAutoLogin: false
        keyAuthEnabled: true
        routePolicy:
          mode: protect-all
          excludePrefixes: []
